# Self-contained local stack: nginx + FastAPI + Redis + MongoDB.
#
#   docker compose build
#   docker compose up
#
# No environment file is required for local use. Optional integrations can be
# configured later in backend/.env. Set PORT or MONGO_URI in a root .env file
# only when overriding the local defaults.

name: incubein

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - incubein-net

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - incubein-net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Self-contained defaults; a root .env file can override MONGO_URI.
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/}
      REDIS_URL: redis://redis:6379/0
      # Persist Google OAuth token on a volume instead of inside the container.
      TOKEN_PATH: /app/data/token.json
      OAUTHLIB_INSECURE_TRANSPORT: "1"
    volumes:
      - scratch-data:/app/scratch
      - attachments-data:/app/attachments
      - token-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - incubein-net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - incubein-net

volumes:
  redis-data:
  mongo-data:
  scratch-data:
  attachments-data:
  token-data:

networks:
  incubein-net:
    driver: bridge
